services:
  db:
    image: postgres:17
    container_name: hevent-db
    environment:
        POSTGRES_USER: ${USERDB:?Missing USERDB variable in .env}
        POSTGRES_PASSWORD: ${PASSWORDDB:?Missing PASSWORDDB variable in .env}
        POSTGRES_DB: ${DBNAME:?Missing DBNAME variable in .env}
    ports:
      - "5432:5432"
    volumes:
      - ./src/scripts/SQL/hEvent.sql:/docker-entrypoint-initdb.d/initDB.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30

  api:
    build: .
    container_name: hevent-api
    environment:
      DATABASE_URL: postgresql://${USERDB}:${PASSWORDDB}@db:5432/${DBNAME}
      PEPPER: ${PEPPER:?Missing PEPPER variable in .env}
      JWT_SECRET: ${JWT_SECRET:?Missing JWT_SECRET variable in .env}
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
